http:
  routers:
    # Router for book service - protected by forward auth
    book-service:
      rule: "PathPrefix(`/books`)"
      service: book-service
      middlewares:
        - cors-middleware
        - auth-middleware
      entryPoints:
        - web

    # Router for auth service - direct access for auth endpoint
    auth-service:
      rule: "PathPrefix(`/auth`) || PathPrefix(`/access-logs`)"
      service: auth-service
      middlewares:
        - cors-middleware
      entryPoints:
        - web

  middlewares:
    # Forward auth middleware configuration
    auth-middleware:
      forwardAuth:
        address: "http://auth-service:8081/auth"
        # Copy these headers from auth service response to the forwarded request
        authResponseHeaders:
          - "X-User-ID"
          - "X-User-Role"
          - "X-Auth-Time"
        # Trust X-Forwarded-* headers
        trustForwardHeader: false

    # CORS middleware configuration
    cors-middleware:
      headers:
        accessControlAllowMethods:
          - "GET"
          - "POST"
          - "PUT"
          - "DELETE"
          - "OPTIONS"
        accessControlAllowHeaders:
          - "Content-Type"
          - "Authorization"
          - "X-User-ID"
          - "X-User-Role"
          - "X-Auth-Time"
        accessControlExposeHeaders:
          - "X-User-ID"
          - "X-User-Role"
          - "X-Auth-Time"
        accessControlAllowOriginList:
          - "*"
        accessControlMaxAge: 3600
        addVaryHeader: true

  services:
    book-service:
      loadBalancer:
        servers:
          - url: "http://book-service:8082"

    auth-service:
      loadBalancer:
        servers:
          - url: "http://auth-service:8081"
